<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<title>Fridge Mind RKNN 流程：主机训练 → RK3566 板端离线识别与库存 → 界面、语音与可选云端助手</title>
<defs>
