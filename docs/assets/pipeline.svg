<text x="825.0" y="78" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">RKNN 转换</text>
<text x="825.0" y="97" font-size="11.5" fill="#52606d" text-anchor="middle">RKNN-Toolkit2</text>
<text x="825.0" y="112" font-size="11.5" fill="#52606d" text-anchor="middle">target rk3566</text>
<rect x="960" y="52" width="190" height="66" rx="9" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/>
<text x="1055.0" y="78" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">部署模型</text>
<text x="1055.0" y="97" font-size="11.5" fill="#52606d" text-anchor="middle">best_fp.rknn（默认）</text>
<text x="1055.0" y="112" font-size="11.5" fill="#52606d" text-anchor="middle">best.rknn（INT8 可选）</text>
