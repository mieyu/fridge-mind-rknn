<text x="365.0" y="97" font-size="11.5" fill="#52606d" text-anchor="middle">416 输入 · 100 轮</text>
<text x="365.0" y="112" font-size="11.5" fill="#52606d" text-anchor="middle">batch 16 · SGD</text>
<rect x="500" y="52" width="190" height="66" rx="9" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/>
