<text x="825.0" y="252" font-size="11.5" fill="#52606d" text-anchor="middle">416 letterbox</text>
<circle cx="744" cy="206" r="9" fill="#2563eb"/><text x="744" y="210" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
